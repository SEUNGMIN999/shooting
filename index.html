/* 레이아웃: 전체 화면 캔버스 위에 화면별 오버레이 카드. 단일 라이트 테마, 칠판 녹색 포인트 */
:root{
  --bg:#F2F4F3;--surface:#FFFFFF;--line:#DCE2DF;--fg:#17201D;--muted:#66736E;
  --point:#1F7A5C;--point-weak:#E2F0EA;--gold:#C9931A;--danger:#C8423A;
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);word-break:keep-all;font-size:15px}
button{font-family:inherit;user-select:none;-webkit-user-select:none;white-space:nowrap;cursor:pointer;border:0;outline:none}
button:focus{outline:none}
button:focus-visible{box-shadow:0 0 0 3px var(--point-weak),0 0 0 4px var(--point)}
input{font-family:inherit;outline:none}
.num{font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr.dim{background:rgba(23,32,29,.38)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:880px;margin:auto;box-shadow:0 10px 40px rgba(23,32,29,.08)}
.panel.sm{max-width:420px}
.panel.md{max-width:560px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--point)}
.sub{color:var(--muted);margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{height:48px;padding:0 22px;border-radius:12px;font-size:16px;font-weight:700;background:var(--point);color:#fff;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:#F7F9F8}
.btn.danger{background:var(--danger)}
.btn.lg{height:58px;font-size:18px;padding:0 30px}
.btn:disabled{opacity:.4;cursor:default}

/* 메뉴 */
#scrMenu .panel{max-width:520px;text-align:center;padding:40px 28px}
.logo{font-size:clamp(34px,7vw,52px);font-weight:900;letter-spacing:-.03em;line-height:1.1}
.logo em{font-style:normal;color:var(--point)}
.slogan{margin-top:10px;font-size:18px;font-weight:600;color:var(--muted)}
.paystub-mini{margin:26px auto 28px;display:inline-flex;gap:0;border:1px dashed var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.paystub-mini span{padding:8px 12px;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.paystub-mini{font-size:11.5px}.paystub-mini span{padding:8px 7px}}
.paystub-mini span+span{border-left:1px dashed var(--line)}
.paystub-mini b{color:var(--fg)}
.menu-btns{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto}
.hint{margin-top:18px;font-size:13px;color:var(--muted)}

/* 선택 화면 */
.sel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sel-head h2{font-size:26px;font-weight:800;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--fg);transition:border-color .15s,transform .08s;white-space:normal}
.card:hover{border-color:#B9C6C0}
.card:active{transform:scale(.98)}
.card.on{border-color:var(--point);box-shadow:0 0 0 3px var(--point-weak)}
.card canvas{width:100%;height:124px;background:#F4F7F5;border-radius:10px}
.card .nm{font-size:17px;font-weight:800}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--point);background:var(--point-weak);padding:3px 8px;border-radius:999px}
.card .ds{font-size:13px;color:var(--muted);line-height:1.45}
.stat{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.stat i{display:block;height:6px;border-radius:3px;background:#E8EDEA;position:relative;overflow:hidden}
.stat i b{position:absolute;inset:0 auto 0 0;background:var(--point);border-radius:3px}
.sel-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;padding-top:max(10px,env(safe-area-inset-top,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:760px;margin:0 auto}
.months div{position:relative;height:22px;border-radius:6px;background:rgba(255,255,255,.85);border:1px solid var(--line);overflow:hidden;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.months div i{position:absolute;inset:0 auto 0 0;background:var(--point-weak);width:0}
.months div span{position:relative}
.months div.done{background:var(--point);border-color:var(--point);color:#fff}
.months div.done i{display:none}
.months div.cur{border-color:var(--point);color:var(--point)}
.months div.boss::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--danger)}
.hud-row{display:flex;gap:8px;align-items:center;max-width:760px;margin:8px auto 0}
.chip{pointer-events:none;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;height:36px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{font-size:15px;color:var(--fg)}
.chip.money b{color:var(--gold)}
.xpwrap{flex:1;min-width:60px;height:36px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:0 10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.xpwrap small{font-size:10px;color:var(--muted);font-weight:700}
.xpbar{height:6px;border-radius:3px;background:#E8EDEA;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--point)}
#scrGate .panel{max-width:460px;text-align:center;padding:44px 28px}
#btnSkip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));height:38px;padding:0 16px;border-radius:10px;background:rgba(23,32,29,.55);border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:700;font-size:14px;z-index:5}
#btnSkip:hover{background:rgba(23,32,29,.7)}
#btnSound{pointer-events:auto;width:40px;height:36px;border-radius:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--point);display:flex;align-items:center;justify-content:center;flex:none}
#btnSound.off{color:var(--muted)}
.btn.snd{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--point)}
.btn.snd.off{color:var(--muted)}
#btnPause{pointer-events:auto;height:36px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--fg)}

#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;transition:opacity .25s}
#banner.show{opacity:1}
#banner .b1{font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--fg);text-shadow:0 2px 0 #fff,0 0 12px #fff}
#banner .b2{margin-top:4px;font-size:clamp(14px,3.4vw,18px);font-weight:700;color:var(--point);text-shadow:0 0 8px #fff,0 0 8px #fff}
#banner.pay .b1{color:var(--gold)}
#banner.boss .b1{color:var(--danger)}

/* 레벨업 */
.lv-head{text-align:center;margin-bottom:18px}
.lv-head h2{font-size:28px;font-weight:900;margin-top:4px}
.lv-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.lv-cards{grid-template-columns:1fr}}
.lv{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;white-space:normal;color:var(--fg);min-height:150px}
.lv:hover{border-color:var(--point);box-shadow:0 0 0 3px var(--point-weak)}
.lv .k{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.lv .k span:first-child{color:var(--point)}
.lv .k span:last-child{color:var(--muted)}
.lv .k.allow span:first-child{color:var(--gold)}
.lv .t{font-size:19px;font-weight:800}
.lv .d{font-size:14px;color:var(--muted);line-height:1.45}
.lv .pips{display:flex;gap:4px;margin-top:auto}
.lv .pips i{width:18px;height:5px;border-radius:3px;background:#E3E8E5}
.lv .pips i.f{background:var(--point)}
.lv .pips i.n{background:var(--gold)}
@media (max-width:560px){.lv{min-height:0;padding:12px 14px;gap:4px}}

/* 명세서 */
.stub{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px;background:#F7FAF8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stub-top h2{font-size:22px;font-weight:900;margin-top:4px}
.stub-meta{display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:13px}
.stub-meta span{color:var(--muted)}
.stub-cols{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:560px){.stub-cols{grid-template-columns:1fr}}
.stub-col{padding:14px 20px}
.stub-col+.stub-col{border-left:1px solid var(--line)}
@media (max-width:560px){.stub-col+.stub-col{border-left:0;border-top:1px solid var(--line)}}
.stub-col h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px dotted #E6EBE8}
.li:last-child{border-bottom:0}
.li.sum{font-weight:800;border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:8px}
.li .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.li .v.minus{color:var(--danger)}
.stub-net{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;background:var(--point);color:#fff;flex-wrap:wrap}
.stub-net span{font-size:14px;font-weight:700;opacity:.9}
.stub-net b{font-size:clamp(26px,6vw,36px);font-weight:900;font-variant-numeric:tabular-nums}
.title-chip{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;color:var(--danger);border:2px solid var(--danger);border-radius:8px;padding:3px 10px;transform:rotate(-3deg)}
.title-chip.clear{color:var(--point);border-color:var(--point)}
.reg{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.reg input{flex:1;min-width:160px;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;color:var(--fg)}
.reg input:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--point-weak)}

/* 명예의 전당 */
.board{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.br{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #EDF1EF}
.br:last-child{border-bottom:0}
.br .rk{font-size:16px;font-weight:900;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.br.top .rk{color:var(--point)}
.br.r1{background:#F3FAF6}
.br .who{min-width:0}
.br .who b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .who small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .amt{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.br.me{box-shadow:inset 3px 0 0 var(--gold);background:#FFF9EA}
.br-x{width:28px;height:28px;border-radius:8px;background:transparent;color:var(--muted);font-size:16px;margin-left:6px}
.br-x:hover{background:#F3E4E2;color:var(--danger)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}
.src{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--point-weak);color:var(--point)}
.src.local{background:#F0F1F0;color:var(--muted)}
.admin{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.admin h4{margin:0 0 8px;font-size:13px;color:var(--muted)}
.admin .reg{margin-top:0}
.admin .reg input.n2{max-width:180px}

/* 토스트 · 확인 */
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.cf-text{margin:10px 0 20px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.panel{padding:20px}.sel-head h2{font-size:22px}.chip{padding:0 8px}.chip span{display:none}}
</style>

function fitText(g, text, cx, cy, maxW, size, color, weight){
  const lines = String(text).split('\n');
  let s = size;
  g.font = `${weight||800} ${s}px ${FONT}`;
  let m = Math.max(...lines.map(l=>g.measureText(l).width));
  if (m > maxW){ s = s*maxW/m; g.font = `${weight||800} ${s}px ${FONT}`; }
  g.fillStyle = color; g.textAlign='center'; g.textBaseline='middle';
  const lh = s*1.08, y0 = cy - (lines.length-1)*lh/2;

}

function bgmTick(){
  if (!SND.ctx || !SND.on) return;
  const playing = (G && !G.over && !G.paused) || (INTRO.active && INTRO.t>12.5);
  if (!playing){ SND.mode=''; return; }
  const mode = G && G.bossAlive ? 'boss' : 'normal', P=BGM[mode], st=60/P.bpm/4, c=SND.ctx;
  if (SND.mode!==mode){ SND.mode=mode; SND.step=0; SND.next=c.currentTime+0.05; }
  if (SND.next < c.currentTime-0.2) SND.next=c.currentTime+0.05;
  while (SND.next < c.currentTime+0.25){
    const s16=SND.step%16, bar=Math.floor(SND.step/16)%4, ch=P.chords[bar], t=SND.next-c.currentTime;
    const pat = bar===3 ? P.last : P.lead, li=pat[s16];
    if (li>=0){ const m = li===3 ? ch[0]+12 : ch[li]; tone(N(m+12), st*1.6, {type:'square', vol:0.09, delay:t, dest:SND.bgm}); }
    if (s16%4===0) tone(N(ch[0]-12), st*3.2, {type:'triangle', vol:0.35, delay:t, dest:SND.bgm});
    if (s16%4===2) tone(N(ch[0]), st*1.5, {type:'triangle', vol:0.18, delay:t, dest:SND.bgm});
    if (s16%2===0) noise(0.03,{ft:'highpass',f:8000,vol:s16%4===0?0.08:0.04,delay:t,dest:SND.bgm});

    SND.step++; SND.next+=st;
  }
}

function updateWeapons(dt, S){
